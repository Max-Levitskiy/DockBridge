name: Release

on:
  push:
    tags:
      - "v*"

env:
  GO_VERSION: "1.24"

jobs:
  release:
    name: Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Install Fyne
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Install Linux dependencies (Linux vs Cross-Compile)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Package Application
        run: |
          mkdir -p dist
          # Get version from tag
          VERSION=${GITHUB_REF_NAME#v}

          # Use PWD to start with absolute path, assuming we start in repo root
          REPO_ROOT=$(pwd)

          if [ "${{ runner.os }}" == "Windows" ]; then
             fyne package -os windows -icon "$REPO_ROOT/gui/assets/icon.png" -name DockBridge.exe -appVersion $VERSION -appBuild 1 -src ./cmd/dockbridge-gui
             mv DockBridge.exe dist/dockbridge-windows-amd64.exe
          elif [ "${{ runner.os }}" == "macOS" ]; then
             fyne package -os darwin -icon "$REPO_ROOT/gui/assets/icon.png" -name DockBridge -appVersion $VERSION -appBuild 1 -src ./cmd/dockbridge-gui
             # Create a zip of the .app for distribution (Fyne produces .app package)
             zip -r dist/dockbridge-macos-amd64.app.zip DockBridge.app
          else
             # Linux
             fyne package -os linux -icon "$REPO_ROOT/gui/assets/icon.png" -name DockBridge -appVersion $VERSION -appBuild 1 -src ./cmd/dockbridge-gui
             mv DockBridge.tar.gz dist/dockbridge-linux-amd64.tar.gz
          fi

      - name: Build Server (Linux only)
        if: runner.os == 'Linux'
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -o dist/dockbridge-server-linux-amd64 ./cmd/server

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > checksums.txt || shasum -a 256 * > checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s" >> CHANGELOG.md || true
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^)...${{ github.ref_name }}" >> CHANGELOG.md || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/dockbridge-*
            dist/checksums.txt
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: release
    if: "!contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha')"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
